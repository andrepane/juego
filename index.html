<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEXIA · Manipulación metalingüística</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" aria-label="Actividad metalingüística">
    <p class="eyebrow">LEXIA</p>
    <h1 id="word-display" class="word">TOMATE</h1>

    <section id="setup-zone" class="setup-zone" aria-label="Selector inicial">
      <p class="setup-title">Primero selecciona cuántas sílabas y letras tiene la palabra.</p>
      <div class="setup-controls">
        <label>
          Sílabas
          <select id="syllables-select">
            <option value="">Selecciona</option>
          </select>
        </label>
        <label>
          Letras
          <select id="letters-select">
            <option value="">Selecciona</option>
          </select>
        </label>
        <button id="setup-btn" type="button">Validar</button>
      </div>
    </section>

    <section class="tiles-zone" aria-label="Representación estructural">
      <div id="tiles" class="tiles"></div>
    </section>

    <p id="instruction" class="instruction">Quita la sílaba del medio.</p>

    <form id="answer-form" class="answer-form" autocomplete="off">
      <input id="answer-input" type="text" placeholder="Escribe la palabra resultante" maxlength="24" required />
      <button type="submit">Comprobar</button>
    </form>

    <p id="feedback" class="feedback idle">Piensa la palabra y escríbela.</p>

    <div class="controls" role="group" aria-label="Controles">
      <button id="mode-btn" type="button">Modo: Sílabas</button>
      <button id="next-btn" type="button">Nueva consigna</button>
      <button id="word-btn" type="button">Nueva palabra</button>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
