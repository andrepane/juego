<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>LEXIA · Actividades fonológicas</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="app" class="shell">
  <section id="home" class="screen active" aria-labelledby="home-title">
    <header class="hero"><p class="brand">LEXIA</p><h1 id="home-title" tabindex="-1">Entrenamiento lingüístico, paso a paso</h1><p>Actividades para trabajar habilidades fonológicas y metalingüísticas.</p></header>
    <div id="activity-catalog"></div>
  </section>
</main>
<dialog id="exit-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">¿Salir de la actividad?</h2><p>El progreso de esta sesión no se guardará.</p><div><button id="cancel-exit" class="primary" type="button">Continuar jugando</button><button id="confirm-exit" class="secondary" type="button">Salir sin guardar</button></div></dialog>
<dialog id="finish-dialog" aria-labelledby="finish-dialog-title"><h2 id="finish-dialog-title">¿Finalizar la sesión?</h2><p>Se conservarán las rondas completadas y omitidas. La ronda abierta no se registrará.</p><div><button id="cancel-finish" class="primary" type="button">Continuar jugando</button><button id="confirm-finish" class="secondary" type="button">Finalizar y ver resumen</button></div></dialog>
<script type="module" src="main.js"></script></body></html>
